name: Build Nuitka HoloPatcher

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: nuitka-build-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  NUITKA_VERSION: '4.2.2'
  PYKOTOR_REPOSITORY: ${{ vars.PYKOTOR_REPOSITORY || format('{0}/PyKotor', github.repository_owner) }}

jobs:
  nuitka:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150

    steps:
      - name: Check out HoloPatcher
        uses: actions/checkout@v7
        with:
          path: HoloPatcher
          persist-credentials: false

      - name: Check out the configured PyKotor backend
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PYKOTOR_REPOSITORY }}
          ref: ${{ vars.PYKOTOR_REF }}
          path: PyKotor
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Linux compiler support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential ccache patchelf tk-dev

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "Nuitka==$NUITKA_VERSION" \
            packaging \
            "ply>=3.11,<4" \
            "charset-normalizer>=2,<4" \
            "defusedxml>=0.7,<1"

      - name: Stage HoloPatcher and its selected backend
        shell: bash
        run: |
          set -euo pipefail
          python HoloPatcher/packaging/nuitka/stage_bundled_project.py \
            --frontend-root HoloPatcher \
            --backend-root PyKotor \
            --output bundled-project \
            --frontend-ref "$GITHUB_SHA"
          python HoloPatcher/packaging/nuitka/generate_ply_tables.py \
            --stage bundled-project

      - name: Install and validate the staged application
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ./bundled-project
          holopatcher --version
          holopatcher --backend-info

      - name: Build the one-file executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force release | Out-Null

          $displayVersion = python -c 'from pathlib import Path; ns = {}; exec(Path("HoloPatcher/src/holopatcher/__init__.py").read_text(encoding="utf-8"), ns); print(ns["CURRENT_VERSION"])'
          if ($LASTEXITCODE -ne 0) { throw "Could not read HoloPatcher version." }
          $env:APP_VERSION = $displayVersion
          $numericVersion = python -c 'import os; from packaging.version import Version; p = Version(os.environ["APP_VERSION"]); assert not p.epoch and len(p.release) <= 4 and all(x <= 65535 for x in p.release); print(".".join(map(str, p.release + (0,) * (4 - len(p.release)))))'
          if ($LASTEXITCODE -ne 0) { throw "Could not encode Windows version." }

          # Resolve Tcl/Tk from the selected setup-python interpreter itself. Running
          # Nuitka under native PowerShell avoids Git Bash/MSYS DLLs influencing
          # Windows dependency discovery.
          $tkJson = python -c 'import json, sys, tkinter; from pathlib import Path; tcl = Path(tkinter.Tcl().eval("info library")).resolve(); root = tcl.parent; candidates = [p.resolve() for p in root.iterdir() if p.is_dir() and p.name.lower().startswith("tk") and ((p / "tk.tcl").is_file() or (p / "dialog.tcl").is_file())]; assert len(candidates) == 1, (root, candidates); print(json.dumps({"tcl": str(tcl), "tk": str(candidates[0])}))'
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the selected Python Tcl/Tk libraries." }
          $tk = $tkJson | ConvertFrom-Json
          Write-Host "Tcl library: $($tk.tcl)"
          Write-Host "Tk library:  $($tk.tk)"

          # The generated script-definition module is exceptionally large. The staged
          # source is split into bounded builders, and the PE stack reserve is raised
          # as a second guard against STATUS_STACK_OVERFLOW (0xC00000FD) in compiled
          # import/parser code. Reserve does not commit 16 MiB up front.
          $stackFlag = "/STACK:16777216,65536"
          if ([string]::IsNullOrWhiteSpace($env:LDFLAGS)) {
            $env:LDFLAGS = $stackFlag
          } else {
            $env:LDFLAGS = "$($env:LDFLAGS) $stackFlag"
          }
          Write-Host "Windows linker flags: $env:LDFLAGS"

          $entry = "bundled-project/src/holopatcher/_packaged_entry.py"
          $output = "HoloPatcher-$displayVersion-nuitka-${{ matrix.target }}"
          $nuitkaArgs = @(
            "--mode=onefile",
            "--onefile-no-compression",
            "--onefile-cache-mode=cached",
            "--onefile-tempdir-spec={CACHE_DIR}/{COMPANY}/{PRODUCT}/{VERSION}",
            "--enable-plugin=tk-inter",
            "--assume-yes-for-downloads",
            "--msvc=latest",
            "--include-module=holopatcher._packaged_backend",
            "--include-module=pykotor.resource.formats.ncs.compiler.lextab",
            "--include-module=pykotor.resource.formats.ncs.compiler.parsetab",
            "--noinclude-setuptools-mode=nofollow",
            "--noinclude-pytest-mode=nofollow",
            "--noinclude-unittest-mode=nofollow",
            "--noinclude-IPython-mode=nofollow",
            "--output-dir=release",
            "--output-filename=$output",
            "--report=release/nuitka-${{ matrix.target }}.xml",
            "--windows-console-mode=disable",
            "--windows-icon-from-ico=HoloPatcher/src/holopatcher/resources/icons/patcher_icon_v2.ico",
            "--company-name=OpenKotOR",
            "--product-name=HoloPatcher",
            "--file-description=HoloPatcher - KOTOR mod installer",
            "--copyright=OpenKotOR PyKotOR Tools",
            "--file-version=$numericVersion",
            "--product-version=$numericVersion",
            "--tcl-library-dir=$($tk.tcl)",
            "--tk-library-dir=$($tk.tk)"
          )

          & python -m nuitka @nuitkaArgs $entry
          if ($LASTEXITCODE -ne 0) { throw "Nuitka failed with exit code $LASTEXITCODE." }

      - name: Build the one-file executable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          display_version=$(python - <<'PY'
          from pathlib import Path
          namespace = {}
          exec(Path("HoloPatcher/src/holopatcher/__init__.py").read_text(encoding="utf-8"), namespace)
          print(namespace["CURRENT_VERSION"])
          PY
          )

          entry=bundled-project/src/holopatcher/_packaged_entry.py
          output="HoloPatcher-${display_version}-nuitka-${{ matrix.target }}"
          args=(
            --mode=onefile
            --enable-plugin=tk-inter
            --assume-yes-for-downloads
            --include-module=holopatcher._packaged_backend
            --include-module=pykotor.resource.formats.ncs.compiler.lextab
            --include-module=pykotor.resource.formats.ncs.compiler.parsetab
            --noinclude-setuptools-mode=nofollow
            --noinclude-pytest-mode=nofollow
            --noinclude-unittest-mode=nofollow
            --noinclude-IPython-mode=nofollow
            --output-dir=release
            --output-filename="$output"
            --report="release/nuitka-${{ matrix.target }}.xml"
          )

          python -m nuitka "${args[@]}" "$entry"

      - name: Build the application bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          display_version=$(python - <<'PY'
          from pathlib import Path
          namespace = {}
          exec(Path("HoloPatcher/src/holopatcher/__init__.py").read_text(encoding="utf-8"), namespace)
          print(namespace["CURRENT_VERSION"])
          PY
          )
          bundle_version=$(APP_VERSION="$display_version" python - <<'PY'
          import os
          from packaging.version import Version

          parsed = Version(os.environ["APP_VERSION"])
          release = parsed.release[:3] + (0,) * (3 - len(parsed.release[:3]))
          print(".".join(str(part) for part in release))
          PY
          )

          entry=bundled-project/src/holopatcher/_packaged_entry.py
          args=(
            --mode=app
            --enable-plugin=tk-inter
            --assume-yes-for-downloads
            --include-module=holopatcher._packaged_backend
            --include-module=pykotor.resource.formats.ncs.compiler.lextab
            --include-module=pykotor.resource.formats.ncs.compiler.parsetab
            --noinclude-setuptools-mode=nofollow
            --noinclude-pytest-mode=nofollow
            --noinclude-unittest-mode=nofollow
            --noinclude-IPython-mode=nofollow
            --output-dir=release
            # Keep the internal Mach-O name distinct from the bundled Python
            # package directory `holopatcher` on case-insensitive macOS volumes.
            --output-filename=HoloPatcherLauncher
            --report="release/nuitka-${{ matrix.target }}.xml"
            --macos-app-name=HoloPatcher
            --macos-app-mode=gui
            --macos-app-icon=HoloPatcher/src/holopatcher/resources/icons/patcher_icon_v2.icns
            --macos-app-version="$bundle_version"
            --macos-signed-app-name=org.openkotor.holopatcher
            --company-name=OpenKotOR
            --product-name=HoloPatcher
            '--file-description=HoloPatcher - KOTOR mod installer'
            '--copyright=OpenKotOR PyKotOR Tools'
            --file-version="$bundle_version"
            --product-version="$bundle_version"
          )

          python -m nuitka "${args[@]}" "$entry"

          app=$(find release -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          final_app="release/HoloPatcher-${display_version}-nuitka-${{ matrix.target }}.app"
          if [[ "$app" != "$final_app" ]]; then
            rm -rf "$final_app"
            mv "$app" "$final_app"
          fi

      - name: Locate and smoke-test the executable (Windows)
        id: artifact_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = "HoloPatcher-*-nuitka-${{ matrix.target }}*"
          $artifacts = @(Get-ChildItem release -File -Filter $prefix | Where-Object { $_.Extension -ne ".xml" })
          if ($artifacts.Count -ne 1) {
            throw "Expected exactly one Nuitka executable, found $($artifacts.Count): $($artifacts.FullName -join ', ')"
          }

          $final = $artifacts[0].FullName
          if ([IO.Path]::GetExtension($final) -ne ".exe") {
            $renamed = [IO.Path]::ChangeExtension($final, ".exe")
            Move-Item -LiteralPath $final -Destination $renamed
            $final = $renamed
          }

          # The Windows artifact is a GUI-subsystem executable. Start-Process -Wait
          # gives the workflow a reliable exit code without creating a console window.
          foreach ($argument in @("--version", "--backend-info")) {
            Write-Host "::group::HoloPatcher $argument"
            $process = Start-Process -FilePath $final -ArgumentList @($argument) -Wait -PassThru
            $code = $process.ExitCode
            Write-Host "Native exit code: $code"
            Write-Host "::endgroup::"
            if ($code -ne 0) { throw "HoloPatcher $argument failed with native exit code $code." }
          }

          $sha = (Get-FileHash -LiteralPath $final -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $final).Length
          "### $([IO.Path]::GetFileName($final))`n`n- Size: $size bytes`n- SHA-256: ``$sha```n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "path=$final" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Locate and smoke-test the executable (Linux)
        id: artifact_linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          prefix="HoloPatcher-*-nuitka-${{ matrix.target }}"
          artifact=$(find release -maxdepth 1 -type f -name "$prefix*" ! -name '*.xml' | head -1)
          test -n "$artifact"

          final="${artifact%.bin}"
          if [[ "$artifact" != "$final" ]]; then
            mv "$artifact" "$final"
          fi
          chmod +x "$final"

          "$final" --version
          "$final" --backend-info

          count=$(find release -maxdepth 1 -type f -name "$prefix*" ! -name '*.xml' | wc -l | tr -d ' ')
          test "$count" = 1

          python - "$final" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          print(f"### {path.name}")
          print()
          print(f"- Size: {path.stat().st_size} bytes")
          print(f"- SHA-256: `{digest}`")
          PY

          echo "path=$final" >> "$GITHUB_OUTPUT"

      - name: Locate, smoke-test, and archive the app bundle (macOS)
        id: artifact_macos
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find release -maxdepth 1 -type d -name 'HoloPatcher-*-nuitka-${{ matrix.target }}.app' -print -quit)
          test -n "$app"

          executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          executable="$app/Contents/MacOS/$executable_name"
          test -x "$executable"

          "$executable" --version
          "$executable" --backend-info

          count=$(find release -maxdepth 1 -type d -name 'HoloPatcher-*-nuitka-${{ matrix.target }}.app' | wc -l | tr -d ' ')
          test "$count" = 1

          archive="${app}.zip"
          rm -f "$archive"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"

          python - "$app" "$archive" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import hashlib
          import pathlib
          import sys

          app = pathlib.Path(sys.argv[1])
          archive = pathlib.Path(sys.argv[2])
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          print(f"### {app.name}")
          print()
          print(f"- Archive: {archive.name}")
          print(f"- Archive size: {archive.stat().st_size} bytes")
          print(f"- SHA-256: `{digest}`")
          PY

          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload Nuitka diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: HoloPatcher-nuitka-${{ matrix.target }}-diagnostics
          path: |
            release/nuitka-${{ matrix.target }}.xml
            release/HoloPatcher-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the Nuitka compilation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: HoloPatcher-nuitka-${{ matrix.target }}-report
          path: release/nuitka-${{ matrix.target }}.xml
          archive: false
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the Nuitka distribution
        uses: actions/upload-artifact@v7
        with:
          name: HoloPatcher-nuitka-${{ matrix.target }}
          path: ${{ steps.artifact_windows.outputs.path || steps.artifact_linux.outputs.path || steps.artifact_macos.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30
