[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HoloPatcher"
version = "2.0b0"
description = "Standalone HoloPatcher frontend for the separately supplied audited PyKotor backend"
requires-python = ">=3.10"
dependencies = [
  "ply>=3.11,<4",
  "charset-normalizer>=2,<4",
  "defusedxml>=0.7,<1",
]
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Nicholas Hugi"}]

[project.scripts]
holopatcher = "holopatcher.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["holopatcher", "holopatcher.*"]
exclude = ["holopatcher.help*", "holopatcher.kits*"]
namespaces = true

[tool.setuptools.package-data]
holopatcher = ["resources/icons/*"]
